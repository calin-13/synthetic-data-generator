[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetic-data-generator"
version = "1.0.0"
description = "Realistic synthetic datasets from a schema, powered by Claude structured outputs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["anthropic>=1.0", "pydantic>=2.6", "pandas>=2.0", "pyarrow>=14.0", "click>=8.1", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
synthgen = "src.cli:main"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
